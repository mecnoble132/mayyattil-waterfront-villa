<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Mayyattil Waterfront Villa</title>
<link rel="icon" type="image/png" href="images/used_under_700kb/logo2.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body class="admin-body">
<div class="admin-wrap">

  <!-- Login -->
  <section class="admin-card admin-login" id="loginCard">
    <h1>Villa Admin</h1>
    <p>Sign in to manage unavailable dates.</p>
    <form id="loginForm" class="admin-form" novalidate>
      <div class="form-group">
        <label for="adminEmail"><i data-lucide="mail"></i> Email</label>
        <input type="email" id="adminEmail" class="form-input" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="adminPassword"><i data-lucide="lock"></i> Password</label>
        <input type="password" id="adminPassword" class="form-input" required autocomplete="current-password">
      </div>
      <p class="admin-error" id="loginError" role="alert"></p>
      <button type="submit" class="btn">Sign in</button>
    </form>
  </section>

  <!-- Panel -->
  <section class="admin-card" id="panelCard" hidden>
    <div class="admin-top">
      <h1>Unavailable Dates</h1>
      <button type="button" class="btn" id="logoutBtn">Sign out</button>
    </div>

    <div class="admin-controls">
      <div class="admin-seg" role="group" aria-label="Selection mode">
        <button type="button" id="modeTap" class="is-active">Tap dates</button>
        <button type="button" id="modeRange">Select a range</button>
      </div>
      <input type="text" id="blockNote" class="form-input" maxlength="80" placeholder="Note for new blocks (e.g. Airbnb booking)">
    </div>
    <p class="admin-hint" id="adminHint">Tap a date to mark it unavailable (red) or available again. A blocked date means that <strong>night</strong> is taken; guests can still check out that morning.</p>

    <div id="adminCalendar"></div>

    <div class="admin-list">
      <h2>Upcoming unavailable dates</h2>
      <div id="blockedList"></div>
    </div>
  </section>
</div>

<div class="admin-toast" id="adminToast" hidden role="status"></div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="calendar.js"></script>
<script src="admin.js"></script>
</body>
</html>
